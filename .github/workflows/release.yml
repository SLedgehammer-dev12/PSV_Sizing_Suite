name: Release Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable using PyInstaller
        run: |
          pyinstaller config/psv_desktop.spec --noconfirm

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $folder = Get-ChildItem -Path dist -Directory | Where-Object { $_.Name -like "PSV_Sizing_Suite_*" } | Select-Object -First 1
          if ($folder) {
            $zip = "dist/PSV_Sizing_Suite_Desktop_$($folder.Name)_Windows.zip"
            Compress-Archive -Path $folder.FullName -DestinationPath $zip -Force
            Write-Host "Created $zip"
          } else {
            Write-Error "No build output folder found in dist/"
          }

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress

      - name: Build Installer using NSIS
        run: |
          $version = python -c "import sys; sys.path.insert(0,'.'); from core import __version_tag__; print(__version_tag__)"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" installer_win.nsi

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS DMG (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app bundle (arm64)
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0,'.'); from core import __version_tag__; print(__version_tag__)")
          pyinstaller --noconsole \
            --name "PSV_Sizing_Suite_${VERSION}" \
            --icon "assets/icon.icns" \
            --add-data "vendor_data:vendor_data" \
            --osx-bundle-identifier "com.psv.sizing-suite" \
            --target-architecture arm64 \
            --noupx \
            --hidden-import desktop.auth \
            --hidden-import desktop.tabs \
            --hidden-import desktop.tabs_extra \
            --hidden-import desktop.workers \
            --hidden-import desktop.graph_window \
            --hidden-import desktop.vendor_window \
            --hidden-import desktop.report_generator \
            --hidden-import core.kb_coefficient \
            --hidden-import core.units \
            --hidden-import core.piping \
            --hidden-import core.valve_types \
            --hidden-import core.advanced_sizing \
            --hidden-import pydantic \
            --hidden-import email \
            --hidden-import importlib.metadata \
            --exclude-module PyQt5.QtSvg \
            --exclude-module PyQt5.QtSql \
            --exclude-module PyQt5.QtQml \
            --exclude-module PyQt5.QtNetwork \
            --exclude-module PyQt5.QtTest \
            --exclude-module PyQt5.QtXml \
            main.py

      - name: Create DMG
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0,'.'); from core import __version_tag__; print(__version_tag__)")
          APP="dist/PSV_Sizing_Suite_${VERSION}.app"
          if [ -d "$APP" ]; then
            hdiutil create -srcfolder "$APP" \
              -volname "PSV_Sizing_Suite_${VERSION}" \
              -fs HFS+ -format UDZO -imagekey zlib-level=9 \
              "dist/PSV_Sizing_Suite_${VERSION}.dmg"
          fi

      # Optional: code sign with a Developer ID cert (requires secrets configured).
      - name: Code sign .app (optional)
        if: env.APPLE_DEVELOPER_ID != ''
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_CERT_B64: ${{ secrets.APPLE_CERT_B64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0,'.'); from core import __version_tag__; print(__version_tag__)")
          APP="dist/PSV_Sizing_Suite_${VERSION}.app"
          echo "$APPLE_CERT_B64" | base64 --decode > /tmp/dev_id.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/dev_id.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
          codesign --deep --force --options runtime --sign "$APPLE_DEVELOPER_ID" "$APP"

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}